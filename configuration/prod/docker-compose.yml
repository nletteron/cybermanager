name: cybermanager-prod

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

x-backend-environment: &backend-environment
  CM_DB_MODE: flyway
  CM_DB_URL: jdbc:postgresql://cybermanager-db:5432/cybermanager
  CM_DB_USERNAME: cybermanager
  CM_DB_PASSWORD: ${CM_DB_PASSWORD:?Set CM_DB_PASSWORD in the production env file}
  CM_JWT_SECRET: ${CM_JWT_SECRET:?Set CM_JWT_SECRET in the production env file}
  JAVA_TOOL_OPTIONS: ${CM_JAVA_TOOL_OPTIONS:--XX:MaxRAMPercentage=75.0}
  SPRING_FLYWAY_BASELINE_ON_MIGRATE: ${CM_FLYWAY_BASELINE_ON_MIGRATE:-false}
  SPRING_FLYWAY_BASELINE_VERSION: "0"

services:
  cybermanager-db:
    image: ${CM_IMAGE_PREFIX:-cybermanager}-db:${CM_IMAGE_TAG:?Set CM_IMAGE_TAG}
    build:
      context: ../database
      dockerfile: ../prod/database/Dockerfile
    container_name: ${CM_DATABASE_BACKUP_CONTAINER:-cybermanager-prod-db}
    restart: unless-stopped
    environment:
      POSTGRES_DB: cybermanager
      POSTGRES_USER: cybermanager
      POSTGRES_PASSWORD: ${CM_DB_PASSWORD:?Set CM_DB_PASSWORD}
    volumes:
      - cybermanager-postgres-data:/var/lib/postgresql/data
      - type: bind
        source: ${CM_DATABASE_DUMP_HOST_DIR:?Set an absolute dump directory on the Docker host}
        target: /var/lib/postgresql/dumps
        bind:
          create_host_path: false
    networks: [application]
    logging: *logging

  cybermanager-auth:
    image: ${CM_IMAGE_PREFIX:-cybermanager}-auth:${CM_IMAGE_TAG:?Set CM_IMAGE_TAG}
    build:
      context: ../..
      dockerfile: configuration/prod/auth/Dockerfile
    restart: unless-stopped
    init: true
    environment:
      <<: *backend-environment
      SPRING_CONFIG_LOCATION: file:/etc/cybermanager/auth/
      CM_FLYWAY_LOCATIONS: filesystem:/etc/cybermanager/auth/db/migration
      CM_AUTH_LOG_LEVEL: ${CM_AUTH_LOG_LEVEL:-INFO}
      CM_AUTH_HTTP_LOG_LEVEL: ${CM_AUTH_HTTP_LOG_LEVEL:-INFO}
    volumes:
      - type: bind
        source: ${CM_AUTH_CONFIG_DIR:-../backends/auth}
        target: /etc/cybermanager/auth
        read_only: true
        bind:
          create_host_path: false
    depends_on:
      cybermanager-db:
        condition: service_healthy
    networks: [application]
    logging: *logging

  cybermanager-api:
    image: ${CM_IMAGE_PREFIX:-cybermanager}-api:${CM_IMAGE_TAG:?Set CM_IMAGE_TAG}
    build:
      context: ../..
      dockerfile: configuration/prod/cybermanager/Dockerfile
    restart: unless-stopped
    init: true
    group_add:
      - "${CM_DOCKER_GID:?Set the Docker socket group ID}"
    environment:
      <<: *backend-environment
      SPRING_CONFIG_LOCATION: file:/etc/cybermanager/cybermanager/
      CM_FLYWAY_LOCATIONS: filesystem:/etc/cybermanager/cybermanager/db/migration
      CM_ERROR_CATALOG_FILE: file:/etc/cybermanager/cybermanager/error.json
      CM_DATABASE_BACKUP_CONTAINER: ${CM_DATABASE_BACKUP_CONTAINER:-cybermanager-prod-db}
      CM_DATABASE_DUMP_DIR: /var/lib/postgresql/dumps
      CM_DATABASE_DUMP_MAX_SIZE: ${CM_DATABASE_DUMP_MAX_SIZE:-1GB}
      CM_LOG_LEVEL: ${CM_LOG_LEVEL:-INFO}
      CM_HTTP_LOG_LEVEL: ${CM_HTTP_LOG_LEVEL:-INFO}
    volumes:
      - type: bind
        source: ${CM_API_CONFIG_DIR:-../backends/cybermanager}
        target: /etc/cybermanager/cybermanager
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${CM_DOCKER_SOCKET:-/var/run/docker.sock}
        target: /var/run/docker.sock
        bind:
          create_host_path: false
    depends_on:
      cybermanager-auth:
        condition: service_healthy
    networks: [application]
    logging: *logging

  cybermanager-front:
    image: ${CM_IMAGE_PREFIX:-cybermanager}-front:${CM_IMAGE_TAG:?Set CM_IMAGE_TAG}
    build:
      context: ../..
      dockerfile: configuration/prod/frontend/Dockerfile
    restart: unless-stopped
    environment:
      CM_AUTH_API_URL: ${CM_AUTH_API_URL:-/auth-api}
      CM_API_URL: ${CM_API_URL:-/api}
    ports:
      - "${CM_FRONT_BIND:-0.0.0.0}:${CM_FRONT_PORT:-8080}:80"
    volumes:
      - type: bind
        source: ${CM_NGINX_CONFIG_FILE:-./frontend/default.conf}
        target: /etc/nginx/conf.d/default.conf
        read_only: true
        bind:
          create_host_path: false
    depends_on:
      cybermanager-api:
        condition: service_healthy
    networks: [application]
    logging: *logging

networks:
  application:

volumes:
  cybermanager-postgres-data:
    name: ${CM_DB_VOLUME_NAME:-cybermanager-prod-postgres-data}
